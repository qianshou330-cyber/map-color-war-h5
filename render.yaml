services:
  - type: web
    name: map-color-war-h5-ws
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: MAP_WIDTH
        value: "1280"
      - key: MAP_HEIGHT
        value: "720"
