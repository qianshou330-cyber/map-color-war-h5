services:
  - type: web
    name: map-color-war-h5-ws
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: MAP_WIDTH
        value: "560"
      - key: MAP_HEIGHT
        value: "700"
      - key: MAP_GENERATION_SEED
        value: room-1-rugged-archipelago
      - key: MAP_GENERATION_WORLD_TYPE
        value: twinContinents
      - key: MAP_GENERATION_SEA_LEVEL
        value: "0.43"
      - key: MAP_GENERATION_MOUNTAIN_STRENGTH
        value: "0.68"
      - key: MAP_GENERATION_MOISTURE
        value: "0.58"
      - key: MAP_GENERATION_RIVER_COUNT
        value: "10"
