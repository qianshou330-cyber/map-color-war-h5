<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Color War H5</title>
  </head>
  <body>
    <div id="app">
      <div id="editor-root"></div>
      <div id="player-setup-root"></div>
      <div id="game-root"></div>
      <div id="hud-root"></div>
      <form id="command-form" autocomplete="off">
        <div id="command-chat" aria-live="polite"></div>
        <div id="command-message" aria-live="polite"></div>
        <div id="player-status" aria-live="polite"></div>
        <div id="command-shortcuts" aria-label="&#x5FEB;&#x6377;&#x6307;&#x4EE4;">
          <button type="button" data-command-prefix="&#x52A0;&#x5165;">&#x52A0;&#x5165;</button>
          <button type="button" data-command-prefix="&#x8FDB;&#x653B;">&#x8FDB;&#x653B;</button>
          <button type="button" data-command-prefix="&#x7ED3;&#x76DF;">&#x7ED3;&#x76DF;</button>
          <button type="button" data-command-prefix="&#x9000;&#x51FA;&#x7ED3;&#x76DF;">&#x9000;&#x51FA;&#x7ED3;&#x76DF;</button>
          <button type="button" data-command-prefix="&#x505C;&#x6218;">&#x505C;&#x6218;</button>
        </div>
        <input
          id="command-input"
          name="command"
          type="text"
          inputmode="text"
          enterkeyhint="send"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="&#x52A0;&#x5165;1-40 &#x843D;&#x5EA7;&#xFF0C;&#x8FDB;&#x653B;13&#xFF0C;&#x53DB;&#x4E71;101-200"
          aria-label="&#x6E38;&#x620F;&#x6307;&#x4EE4;"
        />
        <button id="edit-map-button" type="button">&#x7F16;&#x8F91;</button>
        <button id="command-submit" type="submit">&#x53D1;&#x9001;</button>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
